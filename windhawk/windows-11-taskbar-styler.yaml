# Windhawk mod: Windows 11 Taskbar Styler (windows-11-taskbar-styler) by m417z, tested with v1.11
# Paste into the mod's Advanced tab > Mod settings, then Save.

theme: ''
controlStyles:
  - target: Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton > Taskbar.TaskListButtonPanel#ExperienceToggleButtonRootPanel > Grid > Border#BackgroundElement, Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton > Taskbar.TaskListButtonPanel#ExperienceToggleButtonRootPanel > Border#BackgroundElement
    styles:
      - Margin=0
      - BorderThickness=0
  - target: Windows.UI.Xaml.Controls.Grid#AugmentedEntryPointContentGrid
    styles:
      - Margin=12,0,0,0
      - HorizontalAlignment=Left
  - target: Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton
    styles:
      - Margin=0
      - Visibility={{clickThroughTaskbar}}
  - target: Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton > Taskbar.TaskListButtonPanel#ExperienceToggleButtonRootPanel
    styles:
      - Margin=-400,0,0,0
      - Height={{TaskHeight - 8}}
      - MinWidth=80
      - MaxWidth=200
      - Width=Auto
      - CornerRadius=30
      - Padding=0
      - Background:=Transparent
      - CornerRadius=16
      - BorderThickness=1
      - BorderBrush:=Transparent
  - target: Grid#IconPanel@RunningIndicatorStates > Rectangle#RunningIndicator, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Rectangle#RunningIndicator
    styles:
      - Width=38
      - Width@ActiveRunningIndicator=38
      - Width@InactiveRunningIndicator=38
      - Width@RequestingAttentionRunningIndicator=38
      - Height=38
      - RadiusX=10
      - RadiusY=10
      - VerticalAlignment=Center
      - HorizontalAlignment=Center
      - Margin=0
      - Canvas.ZIndex=-1
      - Fill:=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#2BFFFFFF" Offset="0"/><GradientStop Color="#0FFFFFFF" Offset="1"/></LinearGradientBrush>
      - Fill@ActiveRunningIndicator:=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#4DFFFFFF" Offset="0"/><GradientStop Color="#1FFFFFFF" Offset="1"/></LinearGradientBrush>
      - StrokeThickness=0
  - target: ':root > ScrollViewer > ScrollContentPresenter > Border > Grid'
    styles:
      - ColumnDefinitions:=<ColumnDefinitionCollection><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/></ColumnDefinitionCollection>
      - ActualWidth=>containerGridWidth
      - ActualHeight=>TaskHeight
      - HorizontalAlignment=Stretch
  - target: Taskbar.TaskbarFrame > Grid#RootGrid@DockingStates
    styles:
      - Tag=horizontal
      - Tag@DockedLeft=vertical
      - Tag@DockedRight=vertical
      - Tag=>taskbarDock
  - target: Taskbar.TaskbarFrame
    styles:
      - Width={{taskbarDock==`vertical`?skip():`Auto`}}
      - HorizontalAlignment=Center
      - MaxWidth={{containerGridWidth>0?max(containerGridWidth-330,100):`Infinity`}}
      - Grid.Column=1
  - target: Taskbar.TaskbarFrame > Grid#RootGrid
    styles:
      - Padding=12,0,12,0
      - Margin=0,0,0,4
      - Background:=Transparent
      - HorizontalAlignment=Center
      - Width=Auto
  - target: Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground
    styles:
      - Margin=-11,0,-11,0
  - target: Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill
    styles:
      - Fill:=Transparent
      - RadiusX=16
      - RadiusY=16
      - StrokeThickness=0
      - Canvas.ZIndex=1
  - target: Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundStroke
    styles:
      - // The glass is drawn by the wallpaper (dock-glass); the taskbar stays clear.
      - Visibility=Collapsed
      - Fill=Transparent
      - StrokeThickness=0
      - RadiusX=16
      - RadiusY=16
      - Canvas.ZIndex=2
      - Margin=0
      - VerticalAlignment=Stretch
      - HorizontalAlignment=Stretch
      - Height=NaN
