<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRO Threads</title>
<style>
:root {
  --panel-w: 300px;
  --backdrop: #000000;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000000;
}

body[data-ui="off"] { --panel-w: 0px; }

/* Embedded, the backdrop fills the box round the stage too. */
body[data-embed] .view { background: var(--backdrop); }

/* Without WebGL 2 (webgl.js), a still of the wallpaper in its place. */
body[data-fallback] #wall { visibility: hidden; }
body[data-fallback] .stage { background: #000 url("media/pro.jpg") center / cover no-repeat; }

/* The space left of the panel; the stage is fitted into it. */
.view {
  position: fixed;
  inset: 0 var(--panel-w) 0 0;
  display: grid;
  place-items: center;
  container-type: size;
  background: #0b0c0e;
}

/* The chosen proportions (--ratio, width over height), as large as fits. */
.stage {
  --ratio: 1.5468;
  position: relative;
  width: min(100cqw, calc(100cqh * var(--ratio)));
  aspect-ratio: var(--ratio);
  background: var(--backdrop);
}

#wall {
  display: block;
  width: 100%;
  height: 100%;
}

/* The original, laid over the canvas for comparison (R toggles it). */
.reference {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
}

body[data-reference] .reference { opacity: 1; z-index: 1; }

/* The settings, docked on the right. */
.sidebar {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--panel-w);
  box-sizing: border-box;
  padding: 12px;
  overflow-y: auto;
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  background: #111215;
  scrollbar-width: thin;
  /* Keep room for the scrollbar, so folding the panel doesn't change its width. */
  scrollbar-gutter: stable;
}

body[data-ui="off"] .sidebar { display: none; }

/* Tweakpane, a little roomier and in the wallpaper's greys. */
.sidebar .tp-rotv {
  --tp-base-background-color: #1a1c21;
  --tp-container-background-color: rgba(255, 255, 255, 0.06);
  --tp-input-background-color: rgba(255, 255, 255, 0.07);
  --tp-label-foreground-color: #a8aebb;
  --tp-monitor-background-color: rgba(0, 0, 0, 0.35);
  --cnt-usz: 22px;
  font-size: 12px;
}

/* Phones: the scene on top, the settings in a sheet below it. */
@media (max-width: 720px) {
  :root {
    --panel-w: 0px;
    --sheet-h: min(56dvh, 520px);
  }

  body[data-ui="off"] { --sheet-h: 0px; }

  .view { inset: 0 0 var(--sheet-h) 0; }

  .sidebar {
    top: auto;
    left: 0;
    width: auto;
    height: var(--sheet-h);
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 0;
    overscroll-behavior: contain;
  }
}

/* Fingers: taller rows, and text fields large enough that the page doesn't zoom in on them. */
@media (pointer: coarse) {
  .sidebar .tp-rotv { --cnt-usz: 30px; font-size: 13px; }
  .sidebar input { font-size: 16px; }
}

html, body { background: #000; overflow: hidden; }
</style>
</head>
<body>
<main class="view">
  <div class="stage">
    <canvas id="wall"></canvas>
    <img class="reference" alt="">
  </div>
</main>
<aside class="sidebar"></aside>
<script type="module">
// letters.js
var ASPECT = 2e3 / 1293;
var PX = 1 / 1293;
var CELL = 657 * PX;
var SLIT = 6.5 * PX;
var S = SLIT / CELL;
var SWEEP_R = 32 * PX;
var DOME = 80 * PX;
var FOOT = 56 * PX;
var FOOT_TIP = 44 * PX;
var WEDGE = 110 * PX;
var MAX_LETTERS = 10;
var MAX_CELLS = 32;
var MAX_ROWS = 4;
var MAX_SHEETS = 4;
var MAX_FIBRES = 4;
var SHEET_TEXELS = MAX_SHEETS * 3;
var TEXELS = SHEET_TEXELS + MAX_FIBRES * 3;
var ALPHABET = ["ABCDEFGHI", "JKLMNOPQR", "STUVWXYZ"];
function bend(mode, innerL, innerR, shape2) {
  const R = shape2.corner * PX;
  const ARCH = shape2.arch * PX;
  const TIP = shape2.tip * PX;
  if (mode === "arch") return { d: [innerL ? -ARCH : R, innerR ? ARCH : -R], h: 48 * PX };
  if (mode === "dome") return { d: [innerL ? -ARCH : DOME, innerR ? ARCH : -DOME], h: 120 * PX };
  if (mode === "taper") return { d: [innerL ? -ARCH : 2 * DOME, innerR ? ARCH : -2 * DOME], h: 330 * PX };
  if (mode === "sweep" && innerL && !innerR) return { d: [-TIP, -SWEEP_R], h: 46 * PX };
  if (mode === "sweep" && innerR && !innerL) return { d: [SWEEP_R, TIP], h: 46 * PX };
  if (mode === "wedge" && innerL && !innerR) return { d: [-TIP, -WEDGE], h: 220 * PX };
  if (mode === "wedge" && innerR && !innerL) return { d: [WEDGE, TIP], h: 220 * PX };
  if (mode === "foot" && innerL && !innerR) return { d: [FOOT, FOOT_TIP], h: 42 * PX };
  if (mode === "foot" && innerR && !innerL) return { d: [-FOOT_TIP, -FOOT], h: 42 * PX };

}
var T = 2 / 1293;
var B = 1291 / 1293;
var stem = ["L", T, B, "arch", "sweep"];
var third = [[0, 1 / 3 - S], [1 / 3 + S, 2 / 3 - S], [2 / 3 + S, 1]];
var again = { restart: true };
var glow = { glow: true };
var both = { restart: true, glow: true };
var LETTERS = {
  A: [["L", T, 0.6, "arch", "sweep"], ["R", T, 0.6, "arch", "sweep"], [[0, 0.36], 0.6, B, "round", "round", again], [[0.64, 1], 0.6, B, "round", "round", again]],
  B: [stem, ["R", T, 0.47, "arch", "sweep"], ["R", 0.53, B, "sweep", "sweep", both]],
  C: [stem, ["R", T, 0.3, "arch", "sweep", glow], ["R", 0.7, B, "sweep", "sweep", both]],
  D: [stem, ["R", T, B, "dome", "dome", glow]],
  E: [stem, ["R", T, 0.28, "arch", "sweep", glow], ["R", 0.42, 0.58, "sweep", "sweep", both], ["R", 0.72, B, "sweep", "sweep", both]],
  F: [stem, ["R", T, 0.28, "arch", "sweep", glow], ["R", 0.42, 0.58, "sweep", "sweep", both]],
  G: [stem, ["R", T, 0.28, "arch", "sweep", glow], ["R", 0.48, B, "sweep", "sweep", both]],
  H: [["L", T, 0.5, "round", "sweep"], ["R", T, 0.5, "round", "sweep"], ["L", 0.5, B, "sweep", "round", again], ["R", 0.5, B, "sweep", "round", again]],
  I: [[[0.24, 0.76], T, B, "round", "round"]],
  J: [["R", T, B, "round", "sweep", glow], ["L", 0.62, B, "round", "sweep", { restart: true, lit: true }]],
  K: [["L", T, B, "round", "sweep"], ["R", T, 0.5, "round", "wedge"], ["R", 0.5, B, "wedge", "foot", both]],
  L: [stem, ["R", 0.72, B, "sweep", "sweep", both]],
  M: [[third[0], T, B, "arch", "round"], [third[1], T, B, "arch", "round"], [third[2], T, B, "arch", "round"]],
  N: [["L", T, B, "arch", "round"], ["R", T, B, "arch", "round", glow]],
  O: [stem, ["R", T, B, "arch", "sweep", glow]],
  P: [stem, ["R", T, 968 / 1293, "arch", "sweep", glow]],
  Q: [stem, ["R", T, 0.8, "arch", "sweep"], ["R", 0.8, B, "sweep", "foot", both]],
  R: [stem, ["R", T, 645 / 1293, "arch", "sweep"], ["R", 645 / 1293, B, "sweep", "foot", both]],
  S: [["L", T, 0.52, "arch", "sweep"], ["R", T, 0.32, "arch", "sweep", glow], ["R", 0.4, B, "sweep", "sweep", both], ["L", 0.6, B, "sweep", "sweep", again]],
  T: [["F", T, 0.27, "round", "round"], [[0.3, 0.7], 0.31, B, "round", "round", again]],
  U: [["L", T, B, "round", "arch"], ["R", T, B, "round", "arch", glow]],
  V: [["L", T, B, "round", "taper"], ["R", T, B, "round", "taper", glow]],
  W: [[third[0], T, B, "round", "arch"], [third[1], T, B, "round", "arch"], [third[2], T, B, "round", "arch", glow]],
  X: [["L", T, 0.5, "round", "wedge"], ["R", T, 0.5, "round", "wedge"], ["L", 0.5, B, "wedge", "round", again], ["R", 0.5, B, "wedge", "round", again]],
  Y: [["L", T, 0.5, "round", "sweep"], ["R", T, 0.5, "round", "sweep"], [[0.28, 0.72], 0.5, B, "round", "round", again]],
  Z: [["R", T, 0.52, "arch", "sweep"], ["L", T, 0.32, "arch", "sweep"], ["L", 0.4, B, "sweep", "sweep", again], ["R", 0.6, B, "sweep", "sweep", both]],

var ACCENTS = {
  P: [[0.067, 0.04, 0.96, 1, 0.62, 0.93, 0], [0.941, 0.08, 0.66, 0, 0.3, 0.61, 0]],
  R: [[0.848, 0.04, 0.99, 0.2, 0.56, 0.84, 1]],
  O: [
    [0.157, 0.05, 0.97, 0.8, 0.52, 0.93, 0],
    [0.6, 0.05, 0.88, 0.1, 0.47, 0.83, 0],
    [0.956, 0.06, 0.99, 0.9, 0.62, 0.95, 0],
    [0.93, 0.12, 0.56, 1, 2, 2, 0]

var FALLBACK = LETTERS.O;
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = s + 1831565813 >>> 0;
    let t2 = Math.imul(s ^ s >>> 15, 1 | s);
    t2 ^= t2 + Math.imul(t2 ^ t2 >>> 7, 61 | t2);
    return ((t2 ^ t2 >>> 14) >>> 0) / 4294967296;
  };
}
function accentsFor(ch) {
  if (ACCENTS[ch]) return ACCENTS[ch];
  const rand = seeded(ch.codePointAt(0) * 2654435761);
  return Array.from({ length: 2 }, () => {
    const top = 0.03 + rand() * 0.25;
    const bottom = Math.min(0.98, top + 0.5 + rand() * 0.4);
    const from = top + (bottom - top) * (0.35 + rand() * 0.3);
    return [0.05 + rand() * 0.9, top, bottom, rand(), from, from + (bottom - from) * (0.75 + rand() * 0.25), rand() < 0.2 ? 1 : 0];
  });
}
function pack(lines, shape2) {
  const gap = shape2.gap * PX;
  const rowsOf = lines.slice(0, MAX_ROWS).map((line) => [...line.toUpperCase()]);
  const data = new Float32Array(MAX_CELLS * TEXELS * 4).fill(0);
  const rows = new Float32Array(MAX_ROWS * 4);
  const widthOf = (n) => n * CELL + Math.max(0, n - 1) * gap;
  const width = Math.max(...rowsOf.map((r) => widthOf(r.length)));
  const columns = { L: [0, 0.5 - S], R: [0.5 + S, 1], F: [0, 1] };
  let cell = 0;
  rowsOf.forEach((chars, row) => {
    rows.set([(width - widthOf(chars.length)) / 2, cell, chars.length, 0], row * 4);
    chars.forEach((ch, i) => {
      if (cell >= MAX_CELLS) return;
      const x0 = i * (CELL + gap);
      const at = cell++;
      const texel = (k) => (at * TEXELS + k) * 4;
      for (let k = 0; k < MAX_SHEETS; k++) data[texel(k * 3)] = 1e3;
      for (let k = 0; k < MAX_FIBRES; k++) data[texel(SHEET_TEXELS + k * 3)] = 1e3;
      if (ch === " ") return;

        const e = bend(bottomEnd, innerL, innerR, shape2);

          x0 + b * CELL,

          top,
          bottom,
          blue,
          from,
          to,
          cools,

// shader.js
var VERT = `#version 300 es
  in vec2 aPos;
  uniform vec4 uTile;         // the part of the stage drawn: offset, size
  out vec2 vUv;
  void main() {
    vUv = uTile.xy + vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5) * uTile.zw;
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;
var FRAG = `#version 300 es
  precision highp float;
  const int SHEET_TEXELS = ${SHEET_TEXELS};
  uniform highp sampler2D uSheetTex;
  uniform vec4 uRows[${MAX_ROWS}];
  uniform int uRowCount;
  uniform float uRowPitch;
  uniform float uAspect;      // the stage, width over height
  uniform vec4 uFrame;        // where the letters sit on it: offset, scale across and down
  uniform float uCell;
  uniform float uGap;
  uniform vec2 uPx;           // one pixel, in the letters' frame: across, down
  uniform float uTime;        // the light's clock
  uniform float uFibreTime;   // the coloured threads' clock
  uniform float uDensity;
  uniform float uWarm;
  uniform float uGain;
  uniform vec4 uShape;        // how far the light falls (dim, lit), the floors it settles to
  uniform vec2 uEnd;          // how far and how strongly it rises above an end
  uniform vec4 uFall;         // how sharply it falls (dim, lit), reach below a seam, long threads
  uniform vec4 uMotion;       // breathing, swell, thread texture, rim
  uniform float uSparkle;     // the scattered coloured threads
  uniform vec3 uRamp[5];      // black through navy and steel blue to silver white
  uniform vec3 uGlow;         // where the light ends
  uniform vec3 uFibreCool;    // a coloured fibre above where it warms
  uniform vec3 uFibreWarm[3]; // and as it warms: light, mid, deep
  uniform vec3 uBg;
  in vec2 vUv;
  out vec4 outColor;

  float hash(float n) { return fract(sin(n * 12.9898) * 43758.5453); }

    float i = floor(x);

    return mix(hash(i), hash(i + 1.0), f);
  }
  float vn2(vec2 p) {
    vec2 i = floor(p);

    return mix(mix(hash2(i), hash2(i + vec2(1.0, 0.0)), f.x),

  }

  vec3 ramp(float v) {
    // Highlights roll off softly instead of clipping, so threads stay
    // apart even where the light is brightest.
    v = max(v, 0.0);

  // The thread through (x, y) on a sheet: psi = left + (x - left - off) / scale.
  vec2 thread(vec4 a, vec4 b, vec4 c, float x, float y) {

    // also catches light again above where it ends. The curves are fitted
    // to the original; each thread varies around them a little, and its
    // reach breathes slowly so the light slides up and down.

    float run = down + up;
    float own = vn(u * 0.9 + 17.0);
    float breathe = 1.0 + uMotion.x * 0.52 * (vn2(vec2(u * 0.04, time * 0.22)) - 0.5);
    // A soft swell of light rolling across the word, left to right.
    float swell = 1.0 + 0.12 * uMotion.y * sin(psi * 4.0 - time * 0.7);
    // A run whose light starts again partway down (below a seam) fades
    // faster than one hanging from the top edge.
    float again = restart ? uFall.z : 1.0;
    // A few threads carry their light much further down than the rest.
    float reachTop = mix(uShape.x, uShape.y, side) * again * mix(0.8, 1.2, own) * (1.0 + uFall.w * threadReach) * breathe * swell;
    float floorLight = mix(uShape.z, uShape.w, side);
    float fall = exp(-pow(down / reachTop, mix(uFall.x, uFall.y, side)));
    float reachEnd = uEnd.x * run * mix(0.8, 1.2, vn(u * 0.7 + 41.0)) * (2.0 - breathe);
